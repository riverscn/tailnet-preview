# Services of the example project (docs/design.md 5.2), its database included. The engine adds the
# Tailscale sidecar `ts`.
x-database: &database
  PGHOST: db
  PGUSER: postgres
  PGPASSWORD: ${DB_PASSWORD}
  PGDATABASE: example
  APP_ENV: ${TP_ENV}
  APP_URL: ${TP_URL}

x-needs-db: &needs-db
  db:
    condition: service_healthy

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: example
    volumes:
      - db-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U postgres -d example']
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    image: ${TP_IMAGE_APP}
    environment: *database
    depends_on: *needs-db
    restart: unless-stopped

  # Tasks: run with `docker compose run --rm`, not kept running.
  migrate:
    image: ${TP_IMAGE_APP}
    profiles: [tasks]
    environment: *database
    depends_on: *needs-db
    command: ['psql', '-v', 'ON_ERROR_STOP=1', '-f', '/app/migrate.sql']

  seed:
    image: ${TP_IMAGE_APP}
    profiles: [tasks]
    environment: *database
    depends_on: *needs-db
    command:
      ['sh', '-c', 'psql -v ON_ERROR_STOP=1 -c "INSERT INTO notes (env, body) VALUES (''$$APP_ENV'', ''seeded'')"']

volumes:
  # Listed in DATA_VOLUMES: copied from the baseline into new PR environments.
  db-data:
