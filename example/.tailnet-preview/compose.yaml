# Services of the example project (docs/design.md 5.2). The engine adds the Tailscale sidecar `ts` and
# the `preview` network that reaches the project's PostgreSQL.
x-database: &database
  PGHOST: ${TP_DB_HOST}
  PGPORT: ${TP_DB_PORT}
  PGDATABASE: ${TP_DB_NAME}
  PGUSER: example
  PGPASSWORD: ${TP_DB_PASSWORD}
  APP_ENV: ${TP_ENV}
  APP_URL: ${TP_URL}

services:
  app:
    image: ${TP_IMAGE_APP}
    environment: *database
    networks: [default, preview]
    restart: unless-stopped

  # Tasks: run with `docker compose run --rm`, not kept running.
  migrate:
    image: ${TP_IMAGE_APP}
    profiles: [tasks]
    environment: *database
    networks: [default, preview]
    command: ['psql', '-v', 'ON_ERROR_STOP=1', '-f', '/app/migrate.sql']

  seed:
    image: ${TP_IMAGE_APP}
    profiles: [tasks]
    environment: *database
    networks: [default, preview]
    command:
      ['sh', '-c', 'psql -v ON_ERROR_STOP=1 -c "INSERT INTO notes (env, body) VALUES (''$$APP_ENV'', ''seeded'')"']
