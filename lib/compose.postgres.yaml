# The project's PostgreSQL: one database per environment (docs/design.md section 3).
# Interpolation variables come from ~/previews/<project>/infra/compose.env, written by the engine.
services:
  postgres:
    image: ${POSTGRES_IMAGE}
    container_name: ${PG_CONTAINER}
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - preview
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U postgres -d postgres']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:

networks:
  preview:
    name: ${TP_NETWORK}
    external: true
