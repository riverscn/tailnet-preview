name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: shellcheck
        run: shellcheck bin/tailnet-preview test/*.sh test/fake-tailscale/tailscale example/app/handler.sh
      # With pipefail, `cmd | grep -q` and `cmd | head` fail at random: the reader exits early and cmd gets SIGPIPE.
      - name: no early-exit readers in pipelines
        run: |
          if grep -nE '[^|]\|\s*(grep\s+-[a-zA-Z]*q|head)\b' bin/tailnet-preview test/*.sh action.yml; then
            # shellcheck disable=SC2016 # the message shows code, not an expansion
            echo '::error::capture the output first: grep -q PATTERN <<<"$(cmd)"'
            exit 1
          fi
      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color
      - name: prettier
        run: npx --yes prettier@3.9.9 --check .
      - name: unit tests
        run: node --test 'test/*.test.mjs'
      - name: validate the example's configuration
        run: bin/tailnet-preview validate
        env:
          TP_CONFIG: example/.tailnet-preview

  # The real engine, Docker, PostgreSQL and the example project; only Tailscale is faked.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: test/integration.sh
      # The shared ingress: Traefik, CoreDNS and the fake Tailscale node in kernel mode.
      - run: test/ingress.sh
      # The action's deploy decisions: fresh, upgraded, forked, baseline from the base branch.
      - run: test/action.sh
