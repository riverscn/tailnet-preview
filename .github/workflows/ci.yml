name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: shellcheck
        run: shellcheck bin/tailnet-preview test/*.sh test/fake-tailscale/tailscale example/app/handler.sh
      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color
      - name: prettier
        run: npx --yes prettier@3.9.9 --check .
      - name: unit tests
        run: node --test 'test/*.test.mjs'
      - name: validate the example's configuration
        run: bin/tailnet-preview validate
        env:
          TP_CONFIG: example/.tailnet-preview

  # The real engine, Docker, PostgreSQL and the example project; only Tailscale is faked.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: test/integration.sh
      # The action's deploy decisions: fresh, upgraded, forked, baseline from the base branch.
      - run: test/action.sh
