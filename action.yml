name: tailnet-preview
description: Per-PR preview environments on your own host, reachable only via your tailnet.
author: riverscn
branding:
  icon: eye
  color: blue

inputs:
  command:
    description: 'deploy, destroy, nightly or run (docs/design.md section 8)'
    required: true
  config:
    description: Directory of the project configuration, relative to the repository root
    default: .tailnet-preview
  args:
    description: 'Engine arguments for command "run", e.g. "reset main"'
    default: ''
  language:
    description: Language of the pull request comment (en, zh-CN)
    default: en
  drafts:
    description: 'Deploy draft pull requests too ("true"), or only once they are ready for review ("false")'
    default: 'true'
  branches:
    description: >-
      Branches without an open pull request that get an environment of their own: "" (none), "*" (every
      branch) or globs separated by spaces or commas, e.g. "release/* feature/*". Use the same value in the
      nightly job, which prunes by it (docs/design.md section 3).
    default: ''
  github-token:
    description: Token used to write the pull request comment and list open pull requests
    default: ${{ github.token }}

outputs:
  environment:
    description: Environment name (main, pr-<number> or br-<branch>), empty when the deploy was skipped
    value: ${{ steps.env.outputs.name }}
  url:
    description: URL of the environment after a successful deploy
    value: ${{ steps.deploy.outputs.url }}
  mode:
    description: 'How a PR environment was deployed: forked, upgraded or fresh'
    value: ${{ steps.deploy.outputs.mode }}

runs:
  using: composite
  steps:
    # A branch with an open pull request is served by the PR's environment.
    - name: Pull request of the branch
      id: branch-pr
      if: >-
        inputs.command == 'deploy' && github.event_name == 'push' && inputs.branches != '' &&
        github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
      uses: actions/github-script@v9
      with:
        github-token: ${{ inputs.github-token }}
        result-encoding: string
        script: |
          const branch = context.ref.replace(/^refs\/heads\//, '')
          const prs = await github.rest.pulls.list({ ...context.repo, state: 'open', head: `${context.repo.owner}:${branch}` })
          return prs.data.length ? String(prs.data[0].number) : ''

    - name: Environment
      id: env
      shell: bash
      env:
        TP: ${{ github.action_path }}/bin/tailnet-preview
        COMMAND: ${{ inputs.command }}
        EVENT: ${{ github.event_name }}
        PR: ${{ github.event.pull_request.number }}
        DRAFT: ${{ github.event.pull_request.draft }}
        DRAFTS: ${{ inputs.drafts }}
        BRANCHES: ${{ inputs.branches }}
        BRANCH_PR: ${{ steps.branch-pr.outputs.result }}
        DELETED_REF: ${{ github.event.ref }}
        DELETED_TYPE: ${{ github.event.ref_type }}
        HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        # Not every event gets an environment; a skipped deploy succeeds and says why.
        skip() {
          echo "skip=true" >> "$GITHUB_OUTPUT"
          echo "### No preview environment: $1" >> "$GITHUB_STEP_SUMMARY"
          echo "tailnet-preview: no environment, $1"
          exit 0
        }
        # Deploying runs the PR's code on the host: never for a fork, whatever the workflow's condition says
        # (docs/security.md).
        if [[ $COMMAND == deploy && -n $PR && $HEAD_REPO != "$GITHUB_REPOSITORY" ]]; then
          echo "::error::tailnet-preview does not deploy pull requests from forks ($HEAD_REPO): that would run their code on the preview host"
          exit 1
        fi
        case "$COMMAND" in
          deploy | destroy)
            if [[ -n $PR ]]; then
              name=pr-$PR
              [[ $COMMAND != deploy || $DRAFT != true || $DRAFTS != false ]] || skip "pr-$PR is a draft (drafts: false)"
            elif [[ $EVENT == push && $GITHUB_REF == "refs/heads/$DEFAULT_BRANCH" ]]; then name=main
            elif [[ $EVENT == push && $GITHUB_REF == refs/heads/* ]]; then
              branch=${GITHUB_REF#refs/heads/}
              [[ -n $BRANCHES ]] || skip "branch $branch: branch previews are off (branches input)"
              name=$("$TP" branch-env --match "$BRANCHES" "$branch") || skip "branch $branch does not match '$BRANCHES'"
              [[ -z $BRANCH_PR ]] || skip "branch $branch has pull request #$BRANCH_PR, whose environment serves it"
            elif [[ $EVENT == delete && $DELETED_TYPE == branch && $COMMAND == destroy ]]; then
              name=$("$TP" branch-env "$DELETED_REF")
            else
              echo "::error::tailnet-preview $COMMAND runs on pull_request events, pushes and (destroy) branch deletions"
              exit 1
            fi
            [[ $COMMAND == deploy || $name != main ]] || { echo "::error::destroy does not remove the baseline"; exit 1; }
            ;;
          nightly | run) name=main ;;
          *) echo "::error::unknown command '$COMMAND'"; exit 1 ;;
        esac
        echo "name=$name" >> "$GITHUB_OUTPUT"

    - name: Deploy
      id: deploy
      if: inputs.command == 'deploy' && steps.env.outputs.skip != 'true'
      shell: bash
      env:
        TP: ${{ github.action_path }}/bin/tailnet-preview
        TP_SOURCE: ${{ github.workspace }}
        TP_CONFIG: ${{ github.workspace }}/${{ inputs.config }}
        TP_FAILURE_FILE: ${{ runner.temp }}/tailnet-preview-failure
        TP_NOTICE_FILE: ${{ runner.temp }}/tailnet-preview-notice
        CONFIG_REL: ${{ inputs.config }}
        ENV_NAME: ${{ steps.env.outputs.name }}
        BASE_REF: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
      run: |
        # Actions runs `bash -e`: failures are collected in $code instead of ending the step.
        set +e -uo pipefail
        rm -f "$TP_FAILURE_FILE" "$TP_NOTICE_FILE"
        code=0 mode='' fresh='' url=''
        echo "::group::build images"
        "$TP" build || code=$?
        echo "::endgroup::"
        if [[ $code == 0 && $ENV_NAME != main ]]; then
          "$TP" has "$ENV_NAME"; has=$?
          if [[ $has == 2 ]]; then
            "$TP" has main; has=$?
            if [[ $has == 2 ]]; then
              # No baseline yet: build it from the base branch, or create the PR environment with
              # empty volumes when the base branch does not use tailnet-preview yet.
              base=$RUNNER_TEMP/tailnet-preview-base
              rm -rf "$base" && git worktree prune
              if git fetch --no-tags --depth=1 origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF" &&
                git worktree add --detach "$base" "origin/$BASE_REF" &&
                [[ -f $base/$CONFIG_REL/config.env ]]; then
                echo "::group::initialize the baseline from $BASE_REF"
                (export TP_SOURCE=$base TP_CONFIG=$base/$CONFIG_REL && "$TP" build && "$TP" deploy main >/dev/null) || code=$?
                echo "::endgroup::"
              else
                echo "$BASE_REF has no $CONFIG_REL/config.env: creating this environment with empty volumes"
                fresh=--fresh
              fi
              git worktree remove --force "$base" 2>/dev/null || true
            elif [[ $has != 0 ]]; then code=1
            fi
          elif [[ $has != 0 ]]; then code=1
          fi
        fi
        if [[ $code == 0 ]]; then
          echo "::group::deploy $ENV_NAME"
          url=$("$TP" deploy "$ENV_NAME" $fresh)
          code=$?
          echo "::endgroup::"
          # How the environment got its data: forked, fresh or upgraded.
          mode=$("$TP" info "$ENV_NAME" 2>/dev/null | sed -n 's/^mode=//p')
        fi
        {
          echo "code=$code"
          echo "mode=$mode"
          [[ $code != 0 ]] || echo "url=$url"
        } >> "$GITHUB_OUTPUT"
        [[ $code != 0 ]] || echo "### Preview ready: $url" >> "$GITHUB_STEP_SUMMARY"

    - name: Diagnostics
      if: ${{ !cancelled() && steps.env.outcome == 'success' && steps.env.outputs.skip != 'true' && inputs.command == 'deploy' && steps.deploy.outputs.code != '3' }}
      shell: bash
      env:
        TP: ${{ github.action_path }}/bin/tailnet-preview
        TP_SOURCE: ${{ github.workspace }}
        TP_CONFIG: ${{ github.workspace }}/${{ inputs.config }}
        ENV_NAME: ${{ steps.env.outputs.name }}
      run: |
        echo "::group::diagnostics of $ENV_NAME"
        "$TP" doctor "$ENV_NAME" || true
        echo "::endgroup::"

    - name: Destroy
      if: inputs.command == 'destroy'
      shell: bash
      env:
        TP: ${{ github.action_path }}/bin/tailnet-preview
        TP_SOURCE: ${{ github.workspace }}
        ENV_NAME: ${{ steps.env.outputs.name }}
      run: '"$TP" destroy "$ENV_NAME"'

    - name: Open pull requests
      id: open
      if: inputs.command == 'nightly'
      uses: actions/github-script@v9
      with:
        github-token: ${{ inputs.github-token }}
        result-encoding: string
        script: |
          const prs = await github.paginate(github.rest.pulls.list, { ...context.repo, state: 'open', per_page: 100 })
          // Branches without an open PR of this repository; the next step keeps those that match.
          const heads = new Set(prs.filter((p) => p.head.repo?.full_name === `${context.repo.owner}/${context.repo.repo}`).map((p) => p.head.ref))
          const branches = await github.paginate(github.rest.repos.listBranches, { ...context.repo, per_page: 100 })
          core.setOutput('branches', branches.map((b) => b.name).filter((b) => !heads.has(b)).join('\n'))
          return prs.map((p) => p.number).join(' ')

    - name: Back up and prune
      if: inputs.command == 'nightly'
      shell: bash
      env:
        TP: ${{ github.action_path }}/bin/tailnet-preview
        TP_SOURCE: ${{ github.workspace }}
        TP_CONFIG: ${{ github.workspace }}/${{ inputs.config }}
        OPEN: ${{ steps.open.outputs.result }}
        BRANCH_LIST: ${{ steps.open.outputs.branches }}
        BRANCHES: ${{ inputs.branches }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        "$TP" backup
        keep=$OPEN
        if [[ -n $BRANCHES ]]; then
          while IFS= read -r branch; do
            [[ -n $branch && $branch != "$DEFAULT_BRANCH" ]] || continue
            if env=$("$TP" branch-env --match "$BRANCHES" "$branch"); then keep+=" $env"; fi
          done <<<"$BRANCH_LIST"
        fi
        # shellcheck disable=SC2086
        "$TP" prune $keep

    - name: Run
      if: inputs.command == 'run'
      shell: bash
      env:
        TP: ${{ github.action_path }}/bin/tailnet-preview
        TP_SOURCE: ${{ github.workspace }}
        TP_CONFIG: ${{ github.workspace }}/${{ inputs.config }}
        ARGS: ${{ inputs.args }}
      run: |
        # The checkout is the default branch: it must not end up in a PR or branch environment (docs/design.md section 8).
        if [[ $ARGS =~ ^[[:space:]]*(deploy|reset)[[:space:]]+(pr|br)- ]]; then
          echo "::error::'$ARGS' would deploy the code of $GITHUB_REF into that environment. Run 'destroy <env>' and re-run its deploy job (or push to the branch) instead."
          exit 1
        fi
        # shellcheck disable=SC2086
        "$TP" $ARGS

    - name: Pull request comment
      if: ${{ !cancelled() && steps.env.outcome == 'success' && steps.env.outputs.skip != 'true' && github.event.pull_request.number && (inputs.command == 'destroy' || inputs.command == 'deploy') }}
      uses: actions/github-script@v9
      env:
        COMMENT_JS: ${{ github.action_path }}/lib/comment.cjs
        CONFIG_DIR: ${{ github.workspace }}/${{ inputs.config }}
        FAILURE_FILE: ${{ runner.temp }}/tailnet-preview-failure
        NOTICE_FILE: ${{ runner.temp }}/tailnet-preview-notice
        COMMAND: ${{ inputs.command }}
        CODE: ${{ steps.deploy.outputs.code }}
        URL: ${{ steps.deploy.outputs.url }}
        MODE: ${{ steps.deploy.outputs.mode }}
        LANGUAGE: ${{ inputs.language }}
        SHA: ${{ github.event.pull_request.head.sha }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require('node:fs')
          const { render, upsert } = require(process.env.COMMENT_JS)
          const env = process.env
          const read = (file) => (fs.existsSync(file) ? fs.readFileSync(file, 'utf8') : '')
          const config = read(`${env.CONFIG_DIR}/config.env`)
          const ports = (config.match(/^PORTS=(.*)$/m)?.[1] ?? '').trim().replace(/^(["'])(.*)\1$/, '$2')
          const [reason, detail] = read(env.FAILURE_FILE).trim().split('\t')
          const notices = read(env.NOTICE_FILE).split('\n').filter(Boolean).map((line) => {
            const [code, ...detail] = line.split('\t')
            return { code, detail: detail.join('\t') }
          })
          const data = { language: env.LANGUAGE, sha: env.SHA, url: env.URL, mode: env.MODE, ports,
            extra: read(`${env.CONFIG_DIR}/comment.md`), runUrl: env.RUN_URL, reason, detail, notices }
          const kind = env.COMMAND === 'destroy' ? 'destroyed' : env.CODE === '0' ? 'ready' : env.CODE === '3' ? 'limit' : 'failed'
          await upsert({ github, context, issueNumber: context.payload.pull_request.number, body: render(kind, data) })

    - name: Result
      if: ${{ !cancelled() && steps.env.outcome == 'success' && steps.env.outputs.skip != 'true' && inputs.command == 'deploy' }}
      shell: bash
      env:
        CODE: ${{ steps.deploy.outputs.code }}
      run: |
        # A hit limit is reported on the PR, not as a failed job.
        [[ $CODE == 0 || $CODE == 3 ]] || exit "${CODE:-1}"
